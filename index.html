<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — world-time instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --leather-0:#1b140e;
    --leather-1:#2a2016;
    --brass-hi:#f3dfae;
    --brass-mid:#c9a668;
    --brass-lo:#8a6a30;
    --brass-dark:#3f2f10;
    --steel-hi:#eef0f2;
    --steel-mid:#b9bec6;
    --steel-lo:#7c828c;
    --steel-dark:#23262c;
    --ruby:#c43c3c;
    --ivory:#efe2bd;
    --engrave-light:rgba(255,240,205,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1300px 900px at 18% -12%, #3a2d1f 0%, rgba(58,45,31,0) 55%),
      radial-gradient(1100px 800px at 108% 112%, #221a11 0%, rgba(34,26,17,0) 60%),
      var(--leather-0);
    color:var(--ivory);
    font-family:"Cormorant",Georgia,serif;
    overflow-x:hidden;
  }
  body::after{ /* vignette */
    content:"";position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 220px rgba(0,0,0,.55);
  }
  body::before{ /* saddle stitching around the desk pad */
    content:"";position:fixed;inset:12px;pointer-events:none;
    border:2px dashed rgba(219,183,116,.26);border-radius:16px;
    box-shadow:0 0 0 1px rgba(0,0,0,.32), inset 0 0 0 1px rgba(0,0,0,.32);
  }
  .stage{
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    gap:clamp(24px,4vw,64px);
    flex-wrap:wrap;
    padding:clamp(14px,2.5vh,32px) clamp(20px,4vw,56px);
  }
  /* ---------- Instrument ---------- */
  .dial-wrap{position:relative;flex:0 1 auto;display:flex;flex-direction:column;align-items:center}
  .maker{
    position:relative;
    margin-top:22px;padding:9px 30px 10px;border-radius:999px;
    background:linear-gradient(168deg,#e8cf97,#c9a668 40%,#a9854a 70%,#8a6a30);
    box-shadow:0 8px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,245,215,.7),
               inset 0 -2px 3px rgba(63,47,16,.5);
    text-align:center;
  }
  .maker::before{ /* engraved border ring */
    content:"";position:absolute;inset:4px;border-radius:999px;pointer-events:none;
    border:1px solid rgba(63,47,16,.45);
    box-shadow:0 1px 0 rgba(255,245,210,.3), inset 0 1px 0 rgba(255,245,210,.25);
  }
  .maker .m1{
    display:flex;align-items:center;justify-content:center;gap:11px;
    font-family:"Cormorant",serif;font-weight:700;font-size:16.5px;
    letter-spacing:.10em;color:#42300f;text-shadow:0 1px 0 rgba(255,245,210,.45);
    white-space:nowrap;
  }
  .maker .m1::before,.maker .m1::after{
    content:"";height:1px;width:24px;flex:none;
    box-shadow:0 1px 0 rgba(255,245,210,.35);
  }
  .maker .m1::before{background:linear-gradient(90deg,transparent,rgba(66,48,15,.6))}
  .maker .m1::after{background:linear-gradient(270deg,transparent,rgba(66,48,15,.6))}
  .maker .m2{
    display:block;margin-top:2px;
    font-family:"Alegreya Sans",sans-serif;font-weight:700;font-size:8.5px;
    letter-spacing:.18em;color:rgba(66,48,15,.8);text-shadow:0 1px 0 rgba(255,245,210,.4);
  }
  canvas#dial{
    display:block;
    width:min(86vmin,760px,calc(100vh - 190px));
    height:min(86vmin,760px,calc(100vh - 190px));
    border-radius:50%;
    filter:drop-shadow(0 34px 60px rgba(0,0,0,.62)) drop-shadow(0 8px 18px rgba(0,0,0,.5));
    cursor:grab;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  canvas#dial.dragging{cursor:grabbing}
  canvas#dial:focus-visible{outline:3px solid rgba(243,223,174,.7);outline-offset:6px}
  /* ---------- Plaque ---------- */
  .plaque{
    position:relative;
    width:min(92vw,368px);
    padding:26px 24px 22px;
    border-radius:10px;
    background-image:
      url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cg%20fill='%2342300f'%20fill-opacity='.10'%20stroke='%2342300f'%20stroke-opacity='.16'%20stroke-width='.7'%3E%3Cpath%20d='M50%202%2054.5%2045.5%2050%2050%2045.5%2045.5Z'/%3E%3Cpath%20d='M50%2098%2054.5%2054.5%2050%2050%2045.5%2054.5Z'/%3E%3Cpath%20d='M2%2050%2045.5%2054.5%2050%2050%2045.5%2045.5Z'/%3E%3Cpath%20d='M98%2050%2054.5%2054.5%2050%2050%2054.5%2045.5Z'/%3E%3Cg%20transform='rotate(45%2050%2050)'%3E%3Cpath%20d='M50%2014%2053.2%2046.8%2050%2050%2046.8%2046.8Z'/%3E%3Cpath%20d='M50%2086%2053.2%2053.2%2050%2050%2046.8%2053.2Z'/%3E%3Cpath%20d='M14%2050%2046.8%2053.2%2050%2050%2046.8%2046.8Z'/%3E%3Cpath%20d='M86%2050%2053.2%2053.2%2050%2050%2053.2%2046.8Z'/%3E%3C/g%3E%3C/g%3E%3Ccircle%20cx='50'%20cy='50'%20r='21'%20fill='none'%20stroke='%2342300f'%20stroke-opacity='.18'%20stroke-width='.7'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='2.6'%20fill='%2342300f'%20fill-opacity='.22'/%3E%3C/svg%3E"),
      linear-gradient(168deg, #e8cf97 0%, #c9a668 28%, #a9854a 62%, #c9a668 88%, #8a6a30 100%);
    background-position:right 24px bottom 56px, 0 0;
    background-size:112px 112px, auto;
    background-repeat:no-repeat, no-repeat;
    box-shadow:
      0 22px 44px rgba(0,0,0,.55),
      0 4px 10px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,245,215,.75),
      inset 0 -2px 3px rgba(63,47,16,.55),
      inset 2px 0 3px rgba(255,240,200,.25),
      inset -2px 0 4px rgba(63,47,16,.35);
    color:var(--brass-dark);
  }
  .plaque::before{ /* engraved inner frame */
    content:"";position:absolute;inset:16px;pointer-events:none;
    border:1px solid rgba(63,47,16,.42);border-radius:6px;
    box-shadow:0 1px 0 rgba(255,245,210,.28), inset 0 1px 0 rgba(255,245,210,.22);
  }
  .plaque .screw{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #f6e7bd 0%, #c9a668 45%, #6f5522 100%);
    box-shadow:inset 0 -1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(255,245,210,.5);
  }
  .plaque .screw::after{
    content:"";position:absolute;left:1.5px;right:1.5px;top:50%;height:2px;margin-top:-1px;
    background:linear-gradient(180deg, rgba(40,28,6,.85), rgba(255,240,200,.35));
    border-radius:2px;transform:rotate(var(--slot,20deg));
  }
  .screw.tl{top:8px;left:8px;--slot:24deg}.screw.tr{top:8px;right:8px;--slot:-51deg}
  .screw.bl{bottom:8px;left:8px;--slot:76deg}.screw.br{bottom:8px;right:8px;--slot:-12deg}
  .engraved{
    color:#42300f;
    text-shadow:0 1px 0 rgba(255,245,210,.45);
  }
  .plaque-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:10px;margin-bottom:6px;
    border-bottom:1px solid rgba(63,47,16,.45);
    box-shadow:0 1px 0 rgba(255,245,210,.35);
  }
  .plaque-head h1{
    font-family:"Cormorant SC",serif;font-weight:700;font-size:22px;letter-spacing:.18em;
  }
  .mode-lamp{
    display:inline-flex;align-items:center;gap:7px;
    font-family:"Alegreya Sans",sans-serif;font-size:10.5px;letter-spacing:.16em;font-weight:700;
  }
  .mode-lamp .bulb{
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d9ffd0, #3f9b46 55%, #1d5423);
    box-shadow:inset 0 -1px 1px rgba(0,0,0,.5), 0 0 7px rgba(90,220,110,.75);
  }
  .mode-lamp.set .bulb{
    background:radial-gradient(circle at 35% 30%, #ffe9c2, #c98a2e 55%, #6e4711);
    box-shadow:inset 0 -1px 1px rgba(0,0,0,.5), 0 0 7px rgba(240,180,80,.8);
  }
  /* search */
  .search{position:relative;margin:12px 0 10px}
  .search input{
    width:100%;padding:9px 12px 8px;
    font-family:"Cormorant",serif;font-size:16.5px;font-weight:500;color:var(--ivory);
    background:linear-gradient(180deg,#241d12,#332a1a);
    border:1px solid rgba(63,47,16,.9);
    border-radius:6px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.65), 0 1px 0 rgba(255,245,210,.4);
  }
  .search input::placeholder{color:rgba(239,226,189,.45);font-style:italic}
  .search input:focus{outline:2px solid rgba(63,47,16,.6);outline-offset:1px}
  .search .results{
    position:absolute;z-index:30;left:0;right:0;top:calc(100% + 5px);
    background:linear-gradient(180deg,#2b2318,#1d1710);
    border:1px solid #52401c;border-radius:6px;overflow:hidden;
    box-shadow:0 14px 30px rgba(0,0,0,.6);
    display:none;
  }
  .search .results.open{display:block}
  .search .results button{
    display:flex;width:100%;gap:9px;align-items:center;
    padding:8px 12px;border:0;background:none;cursor:pointer;
    font-family:"Cormorant",serif;font-size:16px;font-weight:500;color:var(--ivory);text-align:left;
  }
  .search .results button:hover,.search .results button.sel{background:rgba(201,166,104,.22)}
  .search .results .co{margin-left:auto;font-size:12px;opacity:.55;font-style:italic}
  /* station rows */
  .stations{list-style:none}
  .stations li{
    display:flex;align-items:center;gap:9px;
    padding:9px 2px 8px;
    border-bottom:1px solid rgba(63,47,16,.35);
    box-shadow:0 1px 0 rgba(255,245,210,.28);
  }
  .stations li:last-child{border-bottom:0;box-shadow:none}
  .stations li.hover{background:rgba(255,245,210,.22);border-radius:4px}
  .stations .flag{font-size:16px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
  .stations .name{
    font-family:"Cormorant SC",serif;font-weight:600;font-size:16.5px;letter-spacing:.07em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stations .swatch{width:8px;height:8px;border-radius:50%;flex:none;
    box-shadow:inset 0 0 0 1px rgba(63,47,16,.6)}
  .stations .loc{
    display:flex;flex-direction:column;gap:1px;min-width:0;
  }
  .stations .zone{
    font-family:"Alegreya Sans",sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;
    color:rgba(63,47,16,.62);text-shadow:0 1px 0 rgba(255,245,210,.35);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stations .right{
    margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
    flex:none;
  }
  .stations .time{
    font-family:"Cormorant",serif;font-size:19px;font-weight:600;line-height:1.05;
    font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;
  }
  .stations .ampm{
    font-size:12.5px;font-weight:700;letter-spacing:.06em;
  }
  .stations .sub{
    display:flex;align-items:center;gap:5px;
    font-family:"Alegreya Sans",sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:.09em;color:rgba(63,47,16,.6);
    text-shadow:0 1px 0 rgba(255,245,210,.35);
  }
  .stations .day{
    font-family:"Alegreya Sans",sans-serif;font-size:9px;font-weight:700;
    padding:1px 4px;border-radius:3px;
    background:rgba(63,47,16,.8);color:#f0dfae;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
  }
  .stations .rm{
    border:0;background:none;cursor:pointer;flex:none;
    width:28px;height:28px;border-radius:50%;
    color:rgba(63,47,16,.55);font-size:14px;line-height:1;
    font-family:"Alegreya Sans",sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .stations .rm:hover{color:#7c1f1f;background:rgba(63,47,16,.15)}
  /* buttons */
  .controls{display:flex;gap:10px;margin-top:16px}
  .btn{
    flex:1;padding:9px 4px 8px;
    font-family:"Cormorant SC",serif;font-weight:700;font-size:14.5px;letter-spacing:.12em;
    color:#20242b;cursor:pointer;
    border-radius:7px;
    border:1px solid #55595f;
    background:linear-gradient(180deg,#f2f4f6 0%, #c3c8cf 45%, #9aa0a9 55%, #c9ced5 100%);
    box-shadow:
      0 3px 6px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -2px 3px rgba(35,38,44,.35);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{
    background:linear-gradient(180deg,#aab0b8 0%, #c9ced5 60%, #b3b9c1 100%);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.35);
    transform:translateY(1px);
  }
  .btn:focus-visible{outline:2px solid #20242b;outline-offset:2px}
  .plaque-note{
    margin-top:14px;text-align:center;
    font-size:11.5px;font-style:italic;color:rgba(63,47,16,.75);
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<main class="stage">
  <div class="dial-wrap">
    <canvas id="dial" width="760" height="760" tabindex="0"
      aria-label="World-time dial. Drag or use arrow keys to change the meeting time."></canvas>
    <div class="maker" aria-hidden="true">
      <span class="m1">MERIDIAN &amp; CO.</span>
      <span class="m2">MARINE WORLD-TIME · No. 1888</span>
    </div>
  </div>

  <aside class="plaque" aria-label="Stations">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <div class="plaque-head">
      <h1 class="engraved">STATIONS</h1>
      <span class="mode-lamp engraved" id="modeLamp"><span class="bulb"></span><span id="modeText">LIVE</span></span>
    </div>

    <div class="search">
      <input id="searchInput" type="text" placeholder="Add a city…" autocomplete="off"
             aria-label="Search for a city to add">
      <div class="results" id="searchResults" role="listbox"></div>
    </div>

    <ul class="stations" id="stationList"></ul>

    <div class="controls">
      <button class="btn" id="btnNow">NOW</button>
      <button class="btn" id="btnBest">BEST&nbsp;TIME</button>
      <button class="btn" id="btnCopy">COPY</button>
    </div>
    <p class="plaque-note engraved">Drag the bezel to set · 5-minute detents</p>
  </aside>
</main>

<script>
'use strict';
/* ============================== data ============================== */
const CITIES = [
  ["Honolulu","US","Pacific/Honolulu",21.3,-157.9],["Anchorage","US","America/Anchorage",61.2,-149.9],
  ["Los Angeles","US","America/Los_Angeles",34.1,-118.2],["San Francisco","US","America/Los_Angeles",37.8,-122.4],
  ["Seattle","US","America/Los_Angeles",47.6,-122.3],["Vancouver","CA","America/Vancouver",49.3,-123.1],
  ["Denver","US","America/Denver",39.7,-105.0],["Chicago","US","America/Chicago",41.9,-87.6],
  ["Mexico City","MX","America/Mexico_City",19.4,-99.1],["New York City","US","America/New_York",40.7,-74.0],
  ["Toronto","CA","America/Toronto",43.7,-79.4],["Bogotá","CO","America/Bogota",4.7,-74.1],
  ["Lima","PE","America/Lima",-12.0,-77.0],["Santiago","CL","America/Santiago",-33.4,-70.7],
  ["São Paulo","BR","America/Sao_Paulo",-23.6,-46.6],["Buenos Aires","AR","America/Argentina/Buenos_Aires",-34.6,-58.4],
  ["Reykjavík","IS","Atlantic/Reykjavik",64.1,-21.9],["London","GB","Europe/London",51.5,-0.1],
  ["Dublin","IE","Europe/Dublin",53.3,-6.3],["Lisbon","PT","Europe/Lisbon",38.7,-9.1],
  ["Casablanca","MA","Africa/Casablanca",33.6,-7.6],["Madrid","ES","Europe/Madrid",40.4,-3.7],
  ["Paris","FR","Europe/Paris",48.9,2.4],["Brussels","BE","Europe/Brussels",50.8,4.4],
  ["Amsterdam","NL","Europe/Amsterdam",52.4,4.9],["Zurich","CH","Europe/Zurich",47.4,8.5],
  ["Rome","IT","Europe/Rome",41.9,12.5],["Berlin","DE","Europe/Berlin",52.5,13.4],
  ["Copenhagen","DK","Europe/Copenhagen",55.7,12.6],["Oslo","NO","Europe/Oslo",59.9,10.8],
  ["Stockholm","SE","Europe/Stockholm",59.3,18.1],["Helsinki","FI","Europe/Helsinki",60.2,24.9],
  ["Warsaw","PL","Europe/Warsaw",52.2,21.0],["Prague","CZ","Europe/Prague",50.1,14.4],
  ["Vienna","AT","Europe/Vienna",48.2,16.4],["Athens","GR","Europe/Athens",38.0,23.7],
  ["Istanbul","TR","Europe/Istanbul",41.0,29.0],["Kyiv","UA","Europe/Kyiv",50.5,30.5],
  ["Moscow","RU","Europe/Moscow",55.8,37.6],["Tel Aviv","IL","Asia/Jerusalem",32.1,34.8],
  ["Cairo","EG","Africa/Cairo",30.0,31.2],["Lagos","NG","Africa/Lagos",6.5,3.4],
  ["Nairobi","KE","Africa/Nairobi",-1.3,36.8],["Johannesburg","ZA","Africa/Johannesburg",-26.2,28.0],
  ["Cape Town","ZA","Africa/Johannesburg",-33.9,18.4],["Dubai","AE","Asia/Dubai",25.2,55.3],
  ["Karachi","PK","Asia/Karachi",24.9,67.0],["Mumbai","IN","Asia/Kolkata",19.1,72.9],
  ["Delhi","IN","Asia/Kolkata",28.6,77.2],["Bangalore","IN","Asia/Kolkata",13.0,77.6],
  ["Dhaka","BD","Asia/Dhaka",23.8,90.4],["Bangkok","TH","Asia/Bangkok",13.8,100.5],
  ["Jakarta","ID","Asia/Jakarta",-6.2,106.8],["Singapore","SG","Asia/Singapore",1.4,103.8],
  ["Hong Kong","HK","Asia/Hong_Kong",22.3,114.2],["Shanghai","CN","Asia/Shanghai",31.2,121.5],
  ["Beijing","CN","Asia/Shanghai",39.9,116.4],["Taipei","TW","Asia/Taipei",25.0,121.6],
  ["Manila","PH","Asia/Manila",14.6,121.0],["Seoul","KR","Asia/Seoul",37.6,127.0],
  ["Tokyo","JP","Asia/Tokyo",35.7,139.7],["Osaka","JP","Asia/Tokyo",34.7,135.5],
  ["Perth","AU","Australia/Perth",-31.9,115.9],["Brisbane","AU","Australia/Brisbane",-27.5,153.0],
  ["Sydney","AU","Australia/Sydney",-33.9,151.2],["Melbourne","AU","Australia/Melbourne",-37.8,145.0],
  ["Auckland","NZ","Pacific/Auckland",-36.8,174.8],["Wellington","NZ","Pacific/Wellington",-41.3,174.8],
].map(([name,cc,tz,lat,lon])=>({name,cc,tz,lat,lon}));

const flagOf = cc => String.fromCodePoint(...[...cc].map(c=>0x1F1E6 + c.charCodeAt(0) - 65));

/* ============================== state ============================== */
const MAX_STATIONS = 6;
let stations = [];
let sel = Date.now();          // selected instant (ms epoch)
let following = true;          // tracking "now"
let hoverRing = -1;

(function initStations(){
  const homeTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const home = CITIES.find(c=>c.tz===homeTz) ||
    {name:(homeTz.split('/').pop()||'Local').replace(/_/g,' '), cc:null, tz:homeTz};
  stations.push(home);
  for (const want of ["New York City","London","Tokyo"]){
    const c = CITIES.find(x=>x.name===want);
    if (c && !stations.some(s=>s.tz===c.tz && s.name===c.name)) stations.push(c);
  }
  stations = stations.slice(0, MAX_STATIONS);
})();

/* ============================== tz math ============================== */
const fmtCache = new Map();
function partsFmt(tz){
  let f = fmtCache.get(tz);
  if (!f){
    f = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,
      weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    fmtCache.set(tz,f);
  }
  return f;
}
function tzParts(tz, ms){
  const o = {};
  for (const p of partsFmt(tz).formatToParts(ms)) o[p.type]=p.value;
  return {wd:o.weekday, mon:o.month, day:+o.day, year:+o.year,
          h:(+o.hour)%24, m:+o.minute};
}
const localMinutes = (tz,ms)=>{ const p=tzParts(tz,ms); return p.h*60+p.m; };
function fmtTime(tz, ms){
  return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true})
    .format(ms).replace(/\s/g,' ');
}
/* "EDT · GMT−4", or just "GMT+9" where no distinct abbreviation exists */
function zoneInfo(tz, ms){
  const nameOf = kind => new Intl.DateTimeFormat('en-US',{timeZone:tz, timeZoneName:kind})
    .formatToParts(ms).find(p=>p.type==='timeZoneName').value;
  const off = nameOf('shortOffset').replace('-','−');
  let ab; try{ ab = nameOf('short').replace('-','−'); }catch{ ab = off; }
  return (ab && ab!==off) ? `${ab} · ${off}` : off;
}
function dayDiff(tz, ms){ // whole days vs the first station's calendar date
  const a = tzParts(stations[0].tz, ms), b = tzParts(tz, ms);
  return Math.round(
    (Date.UTC(b.year, monthNum(b.mon), b.day) - Date.UTC(a.year, monthNum(a.mon), a.day)) / 864e5);
}
const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const monthNum = m => MONTHS[m] ?? 0;

/* ============================== canvas ============================== */
const canvas = document.getElementById('dial');
const mainCtx = canvas.getContext('2d');
const S = 760, C = S/2;
const dpr = Math.min(window.devicePixelRatio||1, 2.5);
canvas.width = S*dpr; canvas.height = S*dpr;
mainCtx.scale(dpr,dpr);
/* rings are static between state changes — cache them offscreen so the
   globe can animate without re-rendering every bezel each frame */
const ringsCanvas = document.createElement('canvas');
ringsCanvas.width = S*dpr; ringsCanvas.height = S*dpr;
const ringsCtx = ringsCanvas.getContext('2d');
ringsCtx.scale(dpr,dpr);
let ctx = mainCtx;   // draw helpers target whichever layer is active
const TAU = Math.PI*2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const CASE_R = 372, CASE_W = 20, RING_OUT = CASE_R - CASE_W, HUB_R = 122;

/* metal palettes — rings alternate brass / nickel */
const METALS = [
  {hi:'#f3dfae', mid:'#c9a668', lo:'#8a6a30', dark:'#3f2f10', light:'rgba(255,240,200,.38)'},
  {hi:'#f0f2f4', mid:'#b9bec6', lo:'#767c86', dark:'#23262c', light:'rgba(255,255,255,.42)'},
];
/* fired-enamel sky: continuous color over the 24h day, wrapping at midnight */
const SKY = [
  [ 0.0,   8, 18, 48], [ 2.5,   6, 14, 40], [ 4.5,  13, 26, 66],
  [ 5.5,  44, 42, 96], [ 6.3, 128, 68, 72], [ 7.0, 200,116, 62],
  [ 8.0, 231,164, 84], [ 9.5, 243,212,146], [12.0, 250,240,200],
  [14.5, 246,226,170], [16.5, 238,196,118], [18.0, 216,146, 66],
  [19.0, 176, 86, 50], [19.8, 118, 62, 92], [20.6,  58, 48,104],
  [21.5,  26, 34, 82], [23.0,  12, 24, 58], [24.0,   8, 18, 48],
];
function skyAt(h){
  h = ((h%24)+24)%24;
  let i = 0;
  while (i < SKY.length-2 && SKY[i+1][0] <= h) i++;
  const a = SKY[i], b = SKY[i+1];
  const t = (h - a[0]) / (b[0] - a[0]);
  return `rgb(${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)},${Math.round(a[3]+(b[3]-a[3])*t)})`;
}
/* accent dots used on the plaque to tie rows to rings */
const RINGDOT = ['#c9a668','#b9bec6','#c9a668','#b9bec6','#c9a668','#b9bec6'];

/* deterministic brushed-metal stops */
function seeded(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/2**32; }; }
function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(a,b,t){
  const A=hexRgb(a),B=hexRgb(b);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;
}
function brushedGradient(pal, seed){
  if (!ctx.createConicGradient) return pal.mid;
  const g = ctx.createConicGradient(-Math.PI/2, C, C);
  const rnd = seeded(seed), N = 110;
  for (let i=0;i<=N;i++){
    const t=i/N, ang=t*TAU;
    // broad sheen: brightest toward upper-left (ang ≈ 1.25π), darkest opposite
    const sheen = 0.5 + 0.5*Math.cos(ang - Math.PI*1.25);
    const jitter = (rnd()-0.5)*0.22;
    const v = Math.min(1, Math.max(0, 0.25 + sheen*0.55 + jitter));
    g.addColorStop(t, mix(pal.lo, pal.hi, v));
  }
  return g;
}

function engraveText(txt, x, y, size, family, pal, weight){
  ctx.font = `${weight||600} ${size}px ${family}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = pal.light;
  ctx.fillText(txt, x, y+1);
  ctx.fillStyle = pal.dark;
  ctx.fillText(txt, x, y);
}

/* text along an arc, chars oriented radially (feet toward hub);
   track = extra px between chars for cartographic letterspaced caps */
function arcText(txt, r, centerAngle, size, family, pal, flip, weight, track){
  ctx.font = `${weight||600} ${size}px ${family}`;
  track = track || 0;
  const chars = [...txt];
  const widths = chars.map(ch=>ctx.measureText(ch).width);
  const total = widths.reduce((a,b)=>a+b,0) + track*(chars.length-1);
  const totalAng = total / r;
  const dir = flip ? -1 : 1;
  let a = centerAngle - totalAng/2 * dir;
  for (let i=0;i<chars.length;i++){
    const w = widths[i], half = (w/2)/r * dir;
    if (i>0) a += track/r * dir;
    a += half;
    ctx.save();
    ctx.translate(C + Math.cos(a)*r, C + Math.sin(a)*r);
    ctx.rotate(a + (flip? -Math.PI/2 : Math.PI/2));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = pal.light; ctx.fillText(chars[i], 0, 1.1);
    ctx.fillStyle = pal.dark;  ctx.fillText(chars[i], 0, 0);
    ctx.restore();
    a += half;
  }
  return totalAng;
}

function annulus(r1, r2, a0, a1){
  ctx.beginPath();
  ctx.arc(C,C,r2,a0,a1);
  ctx.arc(C,C,r1,a1,a0,true);
  ctx.closePath();
}

/* ---------- static furniture ---------- */
function drawCase(){
  // case band
  ctx.save();
  annulus(RING_OUT, CASE_R, 0, TAU);
  const g = ctx.createLinearGradient(C-CASE_R,C-CASE_R,C+CASE_R,C+CASE_R);
  g.addColorStop(0,'#4b4f56'); g.addColorStop(.35,'#23262c');
  g.addColorStop(.65,'#3a3e45'); g.addColorStop(1,'#15171b');
  ctx.fillStyle=g; ctx.fill();
  // knurling (gap at the bottom for the maker's engraving)
  ctx.lineWidth=1.4;
  for (let d=0; d<360; d+=2.5){
    if (d>62 && d<118) continue;
    const a = d*Math.PI/180;
    const r1=CASE_R-3, r2=CASE_R-CASE_W+4;
    ctx.strokeStyle = (d%5<2.5) ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.38)';
    ctx.beginPath();
    ctx.moveTo(C+Math.cos(a)*r1, C+Math.sin(a)*r1);
    ctx.lineTo(C+Math.cos(a)*r2, C+Math.sin(a)*r2);
    ctx.stroke();
  }
  // polished lips
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(C,C,CASE_R-1,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(C,C,RING_OUT+1,0,TAU); ctx.stroke();
  // maker's line incised into the case band
  const incised = {dark:'rgba(214,224,234,.6)', light:'rgba(0,0,0,.55)'};
  arcText('MERIDIAN & CO. · MARINE WORLD-TIME · No. 1888',
    CASE_R-CASE_W/2+1, Math.PI/2, 8.5, '"Cormorant SC"', incised, true, 600, 1.6);
  // slotted case screws on the diagonals
  for (const deg of [45,135,225,315]){
    const a=deg*Math.PI/180;
    const sx=C+Math.cos(a)*(CASE_R-CASE_W/2), sy=C+Math.sin(a)*(CASE_R-CASE_W/2);
    ctx.beginPath(); ctx.arc(sx,sy,3.6,0,TAU);
    const sg=ctx.createRadialGradient(sx-1.2,sy-1.2,.4,sx,sy,3.8);
    sg.addColorStop(0,'#dfe3e8'); sg.addColorStop(.6,'#8d939c'); sg.addColorStop(1,'#3f434a');
    ctx.fillStyle=sg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(deg*1.3);
    ctx.strokeStyle='rgba(15,17,20,.85)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-2.6,0); ctx.lineTo(2.6,0); ctx.stroke();
    ctx.restore();
  }
  // gimbal lugs with pivot screws at 3 and 9 o'clock
  for (const side of [0, Math.PI]){
    ctx.save();
    ctx.translate(C+Math.cos(side)*(CASE_R-CASE_W/2), C+Math.sin(side)*(CASE_R-CASE_W/2));
    ctx.beginPath(); ctx.roundRect(-9,-17,18,34,5);
    const lg=ctx.createLinearGradient(0,-17,0,17);
    lg.addColorStop(0,'#e8cf97'); lg.addColorStop(.5,'#a9854a'); lg.addColorStop(1,'#6f5522');
    ctx.fillStyle=lg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.strokeStyle='rgba(255,245,210,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(-7.5,-15.5,15,31,4); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,5,0,TAU);
    const pg=ctx.createRadialGradient(-1.5,-1.5,.5,0,0,5.2);
    pg.addColorStop(0,'#f6e7bd'); pg.addColorStop(.6,'#b3924f'); pg.addColorStop(1,'#5c4718');
    ctx.fillStyle=pg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.rotate(side+0.5);
    ctx.strokeStyle='rgba(30,20,5,.8)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-3.2,0); ctx.lineTo(3.2,0); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawRing(i, st, count){
  const bandW = (RING_OUT - 6 - HUB_R - 8) / count;
  const rOut = RING_OUT - 6 - bandW*i;
  const rIn  = rOut - bandW + 2.5;
  const pal  = METALS[i%2];
  const lm   = localMinutes(st.tz, snappedSel());
  const rot  = -(lm/1440)*TAU;

  // metal base (screen space so sheen stays put)
  ctx.save();
  annulus(rIn, rOut, 0, TAU);
  ctx.fillStyle = brushedGradient(pal, 77+i*13);
  ctx.fill();
  // groove edges
  ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(C,C,rOut-0.8,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(C,C,rOut-2,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(C,C,rIn+0.8,0,TAU); ctx.stroke();
  ctx.restore();

  const numeralR = rOut - bandW*0.26;
  const enOut = rOut - bandW*0.50;
  const enIn  = rOut - bandW*0.86;
  const numSize = Math.min(14, bandW*0.28);
  const nameSize = Math.min(16.5, bandW*0.32);

  /* enamel channel — continuous sky gradient, in the ring's rotated frame */
  ctx.save();
  ctx.translate(C,C); ctx.rotate(rot); ctx.translate(-C,-C);
  const SEG = 288;
  for (let k=0; k<SEG; k++){
    const a0 = (k/SEG)*TAU - Math.PI/2;
    const a1 = ((k+1)/SEG)*TAU - Math.PI/2 + 0.004;   // overlap kills hairline gaps
    annulus(enIn, enOut, a0, a1);
    ctx.fillStyle = skyAt((k+0.5)*24/SEG);
    ctx.fill();
  }
  // cloisonné hour separators — whisper-thin so the gradient flows through
  ctx.strokeStyle='rgba(0,0,0,.10)'; ctx.lineWidth=0.7;
  for (let h=0; h<24; h++){
    const a = (h*60/1440)*TAU - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(C+Math.cos(a)*enIn, C+Math.sin(a)*enIn);
    ctx.lineTo(C+Math.cos(a)*enOut, C+Math.sin(a)*enOut);
    ctx.stroke();
  }
  // glass depth: dark meniscus at both lips, bright dome band through the middle
  const rec = ctx.createRadialGradient(C,C,enIn, C,C,enOut);
  rec.addColorStop(0,   'rgba(2,6,18,.55)');
  rec.addColorStop(.16, 'rgba(2,6,18,.12)');
  rec.addColorStop(.30, 'rgba(2,6,18,0)');
  rec.addColorStop(.52, 'rgba(255,255,255,0)');
  rec.addColorStop(.62, 'rgba(255,255,255,.16)');
  rec.addColorStop(.72, 'rgba(255,255,255,0)');
  rec.addColorStop(.82, 'rgba(2,6,18,0)');
  rec.addColorStop(.93, 'rgba(2,6,18,.18)');
  rec.addColorStop(1,   'rgba(2,6,18,.55)');
  annulus(enIn, enOut, 0, TAU);
  ctx.fillStyle = rec; ctx.fill();
  // enamel gloss: dark inner lip + light outer lip
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(C,C,enIn+0.6,0,TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(C,C,enOut-0.5,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.arc(C,C,enOut-1.6,0,TAU); ctx.stroke();

  /* worldtimer inlays: gold sun at this ring's noon, silver crescent at its midnight */
  {
    const rMid = (enIn+enOut)/2, ebw = enOut-enIn;
    const rs = Math.min(ebw*0.27, 5.5);
    const sx = C, sy = C + rMid;              // local noon is at +y
    ctx.strokeStyle='rgba(112,74,16,.8)'; ctx.lineWidth=1;
    for (let i=0;i<8;i++){
      const ra=i*Math.PI/4 + Math.PI/8;
      ctx.beginPath();
      ctx.moveTo(sx+Math.cos(ra)*(rs+1.1), sy+Math.sin(ra)*(rs+1.1));
      ctx.lineTo(sx+Math.cos(ra)*(rs+2.9), sy+Math.sin(ra)*(rs+2.9));
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(sx,sy,rs,0,TAU);
    const sg=ctx.createRadialGradient(sx-rs*.4,sy-rs*.4,.4,sx,sy,rs);
    sg.addColorStop(0,'#f8dd9c'); sg.addColorStop(.7,'#d9ab52'); sg.addColorStop(1,'#a97c26');
    ctx.fillStyle=sg; ctx.fill();
    ctx.strokeStyle='rgba(104,68,14,.9)'; ctx.lineWidth=1; ctx.stroke();

    const mx = C, my = C - rMid;              // local midnight is at −y
    const rm = rs;
    ctx.save();
    ctx.beginPath(); ctx.arc(mx,my,rm,0,TAU); ctx.clip();
    const mg=ctx.createRadialGradient(mx-rm*.4,my-rm*.4,.4,mx,my,rm);
    mg.addColorStop(0,'#f4f7fc'); mg.addColorStop(.7,'#c9d4e6'); mg.addColorStop(1,'#93a3c0');
    ctx.fillStyle=mg; ctx.fillRect(mx-rm,my-rm,rm*2,rm*2);
    ctx.beginPath(); ctx.arc(mx+rm*0.62, my-rm*0.28, rm*0.88, 0, TAU);
    ctx.fillStyle = skyAt(0); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(mx,my,rm,0,TAU);
    ctx.strokeStyle='rgba(196,210,238,.55)'; ctx.lineWidth=.8; ctx.stroke();
  }

  /* city name curved at local noon */
  const label = st.name.toUpperCase();
  const noonLocal = (720/1440)*TAU - Math.PI/2;             // local-frame angle of 12:00
  const noonScreen = noonLocal + rot;
  const flip = Math.sin(noonScreen) > 0;                    // lower half of screen → flip
  const nameSpan = arcText(label, numeralR, noonLocal, nameSize, 'Cormorant', pal, flip, 700, nameSize*0.18);

  /* hour ticks + numerals (skip under the name) */
  const angDist = (a,b)=>{ let d=Math.abs(a-b)%TAU; return d>Math.PI? TAU-d : d; };
  // half-hour minor ticks
  ctx.globalAlpha=.45;
  for (let h=0; h<24; h++){
    const a = ((h+0.5)*60/1440)*TAU - Math.PI/2;
    if (angDist(a, noonLocal) < nameSpan/2 + 0.08) continue;
    ctx.strokeStyle=pal.dark; ctx.lineWidth=.8;
    const t1 = rOut - bandW*0.09, t2 = rOut - bandW*0.14;
    ctx.beginPath();
    ctx.moveTo(C+Math.cos(a)*t1, C+Math.sin(a)*t1);
    ctx.lineTo(C+Math.cos(a)*t2, C+Math.sin(a)*t2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  for (let h=0; h<24; h++){
    const a = (h*60/1440)*TAU - Math.PI/2;
    if (angDist(a, noonLocal) < nameSpan/2 + 0.10) continue;
    // tick
    ctx.strokeStyle = pal.dark; ctx.lineWidth = h%3===0 ? 1.8 : 1;
    ctx.beginPath();
    const t1 = rOut - bandW*0.08, t2 = rOut - bandW*0.16;
    ctx.moveTo(C+Math.cos(a)*t1, C+Math.sin(a)*t1);
    ctx.lineTo(C+Math.cos(a)*t2, C+Math.sin(a)*t2);
    ctx.stroke();
    if (h%3===0){
      ctx.save();
      ctx.translate(C+Math.cos(a)*numeralR, C+Math.sin(a)*numeralR);
      ctx.rotate(a+Math.PI/2);
      ctx.font = `500 ${numSize}px "Alegreya Sans"`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = pal.light; ctx.fillText(String(h), 0, 1);
      ctx.fillStyle = pal.dark;  ctx.fillText(String(h), 0, 0);
      ctx.restore();
    }
  }
  ctx.restore();

  /* fired-enamel gloss — screen-fixed, so it reads as light on glazing */
  ctx.save();
  annulus(enIn, enOut, 0, TAU); ctx.clip();
  const gloss = ctx.createRadialGradient(C-170, C-210, 40, C, C, rOut+40);
  gloss.addColorStop(0,'rgba(255,255,255,.22)');
  gloss.addColorStop(.45,'rgba(255,255,255,.05)');
  gloss.addColorStop(.75,'rgba(255,255,255,0)');
  gloss.addColorStop(1,'rgba(0,0,10,.12)');
  ctx.fillStyle=gloss; ctx.fillRect(0,0,S,S);
  // crisp glare streak where the room light rakes the glazing
  ctx.strokeStyle='rgba(255,255,255,.14)';
  ctx.lineWidth=(enOut-enIn)*0.36; ctx.lineCap='round';
  ctx.shadowColor='rgba(255,255,255,.3)'; ctx.shadowBlur=7;
  ctx.beginPath(); ctx.arc(C,C,(enIn+enOut)/2, Math.PI*1.12, Math.PI*1.30); ctx.stroke();
  ctx.restore();

  /* hover glow */
  if (i===hoverRing){
    ctx.save();
    annulus(rIn, rOut, 0, TAU);
    ctx.fillStyle='rgba(255,225,150,.14)';
    ctx.fill();
    ctx.restore();
  }
  return {rOut, rIn};
}

function drawHubBezel(){ // static steel bezel + dark well the globe sits in
  ctx.save();
  ctx.beginPath(); ctx.arc(C,C,HUB_R,0,TAU);
  const bg = ctx.createLinearGradient(C-HUB_R,C-HUB_R,C+HUB_R,C+HUB_R);
  bg.addColorStop(0,'#585d64'); bg.addColorStop(.5,'#191c20'); bg.addColorStop(1,'#43474e');
  ctx.fillStyle=bg; ctx.fill();
  ctx.beginPath(); ctx.arc(C,C,HUB_R-5,0,TAU);
  ctx.fillStyle='#04070d'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(C,C,HUB_R-5,0,TAU); ctx.stroke();
  ctx.restore();
}

/* mean sun position: declination from day-of-year, subsolar longitude
   from UTC time (ignores equation of time — worst case ~15 min) */
function sunPosition(ms){
  const d = new Date(ms);
  const N = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())
           - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
  const decl = -23.44*Math.PI/180 * Math.cos(TAU*(N+10)/365);
  const utcH = d.getUTCHours() + d.getUTCMinutes()/60;
  const lams = (180 - 15*utcH) * Math.PI/180;
  return {decl, lams};
}
/* daylight test for a city, independent of globe rotation */
function cityDaylight(st, sun){
  const la = st.lat*Math.PI/180, lo = st.lon*Math.PI/180;
  return Math.cos(sun.decl)*Math.cos(la)*Math.cos(lo - sun.lams)
       + Math.sin(sun.decl)*Math.sin(la);
}

/* low-res buffer for the terminator shading, upscaled over the sphere */
const SHADE_N = 144;
const shadeCanvas = document.createElement('canvas');
shadeCanvas.width = shadeCanvas.height = SHADE_N;
const shadeCtx = shadeCanvas.getContext('2d');
const shadeImg = shadeCtx.createImageData(SHADE_N, SHADE_N);

function drawGlobe(theta, ms){
  const R = HUB_R - 9;
  const tilt = -0.40, ct = Math.cos(tilt), st = Math.sin(tilt);
  const sun = sunPosition(ms);
  // sun direction in view space (same lon-rotation + tilt as proj)
  const cd = Math.cos(sun.decl), sd = Math.sin(sun.decl);
  const sx = cd*Math.sin(sun.lams+theta);
  const sy = sd*ct - cd*Math.cos(sun.lams+theta)*st;
  const sz = sd*st + cd*Math.cos(sun.lams+theta)*ct;
  const proj = (lat, lon)=>{
    const cl = Math.cos(lat);
    const x = cl*Math.sin(lon+theta), y = Math.sin(lat), z = cl*Math.cos(lon+theta);
    return [C + x*(R-2), C - (y*ct - z*st)*(R-2), y*st + z*ct];
  };
  const seg = (pts, test, color, w)=>{
    ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath();
    let pen=false;
    for (const [X,Y,z] of pts){
      if (test(z)){ pen ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y); pen=true; }
      else pen=false;
    }
    ctx.stroke();
  };
  // build graticule polylines
  const meridians=[], parallels=[];
  for (let k=0;k<12;k++){
    const lon = k*TAU/12, pts=[];
    for (let d=-86; d<=86; d+=4) pts.push(proj(d*Math.PI/180, lon));
    meridians.push(pts);
  }
  for (const d of [-60,-30,0,30,60]){
    const lat = d*Math.PI/180, pts=[];
    for (let l=0; l<=360; l+=4) pts.push(proj(lat, l*Math.PI/180));
    parallels.push({pts, eq: d===0});
  }
  ctx.save();
  // glass sphere
  ctx.beginPath(); ctx.arc(C,C,R,0,TAU);
  const g = ctx.createRadialGradient(C-R*0.38, C-R*0.48, R*0.08, C, C, R);
  g.addColorStop(0,'#69b2e8'); g.addColorStop(.3,'#2c68ac');
  g.addColorStop(.65,'#143c74'); g.addColorStop(1,'#091a38');
  ctx.fillStyle=g; ctx.fill();
  ctx.clip();
  // graticule seen through the glass (back)
  for (const p of meridians) seg(p, z=>z<0, 'rgba(110,180,250,.10)', 1);
  for (const p of parallels) seg(p.pts, z=>z<0, 'rgba(110,180,250,.09)', p.eq?1.2:1);
  // night hemisphere + twilight band at the terminator
  {
    const data = shadeImg.data;
    let idx = 0;
    for (let j=0;j<SHADE_N;j++){
      const ny = (j+0.5-SHADE_N/2)/(SHADE_N/2);
      for (let i=0;i<SHADE_N;i++){
        const nx = (i+0.5-SHADE_N/2)/(SHADE_N/2);
        const rr = nx*nx+ny*ny;
        if (rr>1){ data[idx+3]=0; idx+=4; continue; }
        const nz = Math.sqrt(1-rr);
        const t = nx*sx - ny*sy + nz*sz;          // screen y points down
        const tw = Math.max(0, 1-Math.abs(t)/0.09);
        const night = t<0 ? Math.min(1,-t*3.2) : 0;
        data[idx]   = 6 + 190*tw*0.9;
        data[idx+1] = 13 + 85*tw*0.9;
        data[idx+2] = 34 + 20*tw;
        data[idx+3] = Math.max(night*160, tw*80);
        idx+=4;
      }
    }
    shadeCtx.putImageData(shadeImg,0,0);
    ctx.drawImage(shadeCanvas, C-R, C-R, R*2, R*2);
  }
  // graticule front
  for (const p of meridians) seg(p, z=>z>=0, 'rgba(150,214,255,.32)', 1);
  for (const p of parallels) seg(p.pts, z=>z>=0,
    p.eq ? 'rgba(180,228,255,.48)' : 'rgba(150,214,255,.30)', p.eq?1.3:1);
  // stations as city points at their true coordinates
  stations.forEach((st,i)=>{
    if (st.lat===undefined) return;
    const la = st.lat*Math.PI/180, lo = st.lon*Math.PI/180;
    const [X,Y,z] = proj(la, lo);
    const day = cityDaylight(st, sun) > 0;
    if (z < 0){ // seen through the glass
      ctx.beginPath(); ctx.arc(X,Y,2,0,TAU);
      ctx.fillStyle='rgba(180,210,250,.14)'; ctx.fill();
      return;
    }
    if (i===hoverRing){ // pick out this station's meridian
      const pts=[]; for (let d2=-86; d2<=86; d2+=4) pts.push(proj(d2*Math.PI/180, lo));
      seg(pts, zz=>zz>=0, 'rgba(255,216,138,.5)', 1.2);
    }
    ctx.beginPath(); ctx.arc(X,Y, i===hoverRing?4.5:3.2, 0,TAU);
    if (day){
      ctx.save(); ctx.shadowColor='rgba(255,200,110,.95)'; ctx.shadowBlur=9;
      ctx.fillStyle='#ffd88a'; ctx.fill(); ctx.restore();
    } else {
      ctx.fillStyle='rgba(196,220,252,.95)'; ctx.fill();
    }
    ctx.strokeStyle='rgba(6,16,40,.8)'; ctx.lineWidth=1; ctx.stroke();
    if (i===hoverRing){
      ctx.beginPath(); ctx.arc(X,Y,6.5,0,TAU);
      ctx.strokeStyle='rgba(255,240,210,.85)'; ctx.lineWidth=1.2; ctx.stroke();
    }
  });
  // limb depth
  const lg = ctx.createRadialGradient(C,C,R*0.55, C,C,R);
  lg.addColorStop(0,'rgba(3,10,26,0)'); lg.addColorStop(1,'rgba(3,10,26,.58)');
  ctx.fillStyle=lg; ctx.fillRect(C-R,C-R,R*2,R*2);
  // specular bloom + hard glint
  const sp = ctx.createRadialGradient(C-R*0.42, C-R*0.52, 2, C-R*0.42, C-R*0.52, R*0.55);
  sp.addColorStop(0,'rgba(255,255,255,.5)'); sp.addColorStop(.35,'rgba(255,255,255,.12)');
  sp.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sp; ctx.fillRect(C-R,C-R,R*2,R*2);
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(C,C,R-7, Math.PI*1.18, Math.PI*1.34); ctx.stroke();
  // rim light low-right, as glass catches the leather's warmth
  ctx.strokeStyle='rgba(150,200,255,.22)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(C,C,R-1.5, Math.PI*0.12, Math.PI*0.46); ctx.stroke();
  ctx.restore();
  // hard glass edge
  ctx.strokeStyle='rgba(185,225,255,.30)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(C,C,R,0,TAU); ctx.stroke();
}

function drawHubText(){ // etched into the glass
  const etch = (txt, y, size, family, weight, fill)=>{
    ctx.font=`${weight} ${size}px ${family}`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,12,34,.75)'; ctx.fillText(txt, C, y+1.2);
    ctx.fillStyle=fill; ctx.fillText(txt, C, y);
  };
  const ms = snappedSel();
  const home = stations[0];
  const p = tzParts(home.tz, ms);
  ctx.letterSpacing='4px';
  etch('MERIDIAN', C-64, 18, 'Cormorant', 700, 'rgba(234,246,255,.92)');
  ctx.letterSpacing='0px';
  etch('W O R L D · T I M E', C-47, 8, '"Alegreya Sans"', 700, 'rgba(190,222,250,.55)');
  ctx.save();
  ctx.shadowColor='rgba(90,170,255,.55)'; ctx.shadowBlur=12;
  etch(fmtTime(home.tz, ms), C-6, 40, 'Cormorant', 600, '#f2f8ff');
  ctx.restore();
  ctx.letterSpacing='2px';
  etch(home.name.toUpperCase(), C+24, 12.5, 'Cormorant', 600, 'rgba(214,236,255,.78)');
  ctx.letterSpacing='0px';
  // date on a smoked-glass pill
  const w=94, h=21, y=C+42;
  ctx.beginPath(); ctx.roundRect(C-w/2, y, w, h, 10.5);
  ctx.fillStyle='rgba(3,14,34,.52)'; ctx.fill();
  ctx.strokeStyle='rgba(170,215,255,.30)'; ctx.lineWidth=1; ctx.stroke();
  ctx.font='700 11.5px "Alegreya Sans"'; ctx.letterSpacing='1.5px';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#cfe6ff';
  ctx.fillText(`${p.wd.toUpperCase()} ${p.mon.toUpperCase()} ${p.day}`, C, y+h/2+0.5);
  ctx.letterSpacing='0px';
}

function drawLubber(){
  ctx.save();
  // blued-steel spade needle from the jewel down to the hub
  const y0 = C-CASE_R+17, y1 = C-HUB_R+4;
  const ng = ctx.createLinearGradient(C-4,0,C+4,0);
  ng.addColorStop(0,'#060d1d'); ng.addColorStop(.42,'#1d3a68');
  ng.addColorStop(.5,'#41689e'); ng.addColorStop(.58,'#1d3a68'); ng.addColorStop(1,'#050b19');
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=5; ctx.shadowOffsetY=2;
  ctx.beginPath();
  ctx.moveTo(C-2.1, y0);
  ctx.lineTo(C-1.4, y1-17);
  ctx.lineTo(C-4.2, y1-13);
  ctx.lineTo(C, y1);
  ctx.lineTo(C+4.2, y1-13);
  ctx.lineTo(C+1.4, y1-17);
  ctx.lineTo(C+2.1, y0);
  ctx.closePath();
  ctx.fillStyle=ng; ctx.fill();
  ctx.shadowColor='transparent';
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=.8; ctx.stroke();
  // polished spine catching the light
  ctx.strokeStyle='rgba(150,190,240,.55)'; ctx.lineWidth=.7;
  ctx.beginPath(); ctx.moveTo(C, y0+2); ctx.lineTo(C, y1-15); ctx.stroke();
  // ruby jewel in a brass collet at the case
  const jy = C-CASE_R+10;
  ctx.beginPath(); ctx.arc(C, jy, 8.5, 0, TAU);
  ctx.strokeStyle='rgba(201,166,104,.9)'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(C, jy, 6.5, 0, TAU);
  const jg = ctx.createRadialGradient(C-2, jy-2.5, 0.5, C, jy, 7);
  jg.addColorStop(0,'#ff9d94'); jg.addColorStop(.35,'#d84a44');
  jg.addColorStop(.8,'#8e1f1e'); jg.addColorStop(1,'#5c0f10');
  ctx.fillStyle=jg; ctx.fill();
  ctx.strokeStyle='rgba(255,235,200,.55)'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function drawGlass(){
  ctx.save();
  ctx.beginPath(); ctx.arc(C,C,RING_OUT,0,TAU); ctx.clip();
  const g = ctx.createRadialGradient(C-250, C-320, 40, C-120, C-160, 620);
  g.addColorStop(0,'rgba(255,255,255,.15)');
  g.addColorStop(.35,'rgba(255,255,255,.05)');
  g.addColorStop(.6,'rgba(255,255,255,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,S,S);
  ctx.restore();
}

function rebuildRings(){
  ctx = ringsCtx;
  ctx.clearRect(0,0,S,S);
  drawCase();
  const n = stations.length;
  for (let i=0;i<n;i++) drawRing(i, stations[i], n);
  drawHubBezel();
  ctx = mainCtx;
}

/* globe angle: geared to the scrubbed instant (24 h = one revolution),
   plus a slow ambient spin so the glass always lives */
function globeTheta(ts){
  const base = ((snappedSel()/60000) % 1440) / 1440 * TAU;
  return base + (REDUCED ? 0 : (ts/90000) * TAU);
}

function drawFrame(ts){
  mainCtx.clearRect(0,0,S,S);
  mainCtx.drawImage(ringsCanvas, 0, 0, S, S);
  drawGlobe(globeTheta(ts), snappedSel());
  drawHubText();
  drawLubber();
  drawGlass();
}

/* ============================== interaction ============================== */
const SNAP = 5*60*1000;
const snappedSel = ()=> Math.round(sel/SNAP)*SNAP;

function pointerAngle(e){
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (S/r.width) - C;
  const y = (e.clientY - r.top) * (S/r.height) - C;
  return {ang:Math.atan2(y,x), rad:Math.hypot(x,y)};
}
let drag = null;
canvas.addEventListener('pointerdown', e=>{
  const {ang} = pointerAngle(e);
  drag = {ang, sel};
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e=>{
  if (drag){
    const {ang} = pointerAngle(e);
    let d = ang - drag.ang;
    if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
    drag.ang = ang;
    drag.sel += d/TAU * 1440 * 60000;   // dragging clockwise advances time
    sel = drag.sel;
    setFollowing(false);
    update();
  } else {
    const {rad} = pointerAngle(e);
    const n = stations.length;
    const bandW = (RING_OUT - 6 - HUB_R - 8)/n;
    let idx = -1;
    if (rad < RING_OUT-6 && rad > HUB_R+8) idx = Math.floor((RING_OUT - 6 - rad)/bandW);
    if (idx !== hoverRing){ hoverRing = idx; hoverChanged(); }
  }
});
function endDrag(){
  if (!drag) return;
  drag = null;
  sel = snappedSel();
  canvas.classList.remove('dragging');
  update();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', ()=>{ if(hoverRing!==-1){hoverRing=-1;hoverChanged();} });
canvas.addEventListener('keydown', e=>{
  const step = e.shiftKey ? 60 : 15;
  if (e.key==='ArrowRight' || e.key==='ArrowUp'){ sel = snappedSel() + step*60000; setFollowing(false); update(); e.preventDefault(); }
  if (e.key==='ArrowLeft' || e.key==='ArrowDown'){ sel = snappedSel() - step*60000; setFollowing(false); update(); e.preventDefault(); }
});

/* ============================== plaque ============================== */
const stationList = document.getElementById('stationList');
const modeLamp = document.getElementById('modeLamp');
const modeText = document.getElementById('modeText');

function setFollowing(v){
  following = v;
  modeLamp.classList.toggle('set', !v);
  modeText.textContent = v ? 'LIVE' : 'SET';
}

function renderStations(){
  const ms = snappedSel();
  stationList.innerHTML='';
  stations.forEach((st,i)=>{
    const li = document.createElement('li');
    li.dataset.i = i;
    if (i===hoverRing) li.classList.add('hover');
    const dd = dayDiff(st.tz, ms);
    const p = tzParts(st.tz, ms);
    const [tnum, tmer] = fmtTime(st.tz, ms).split(/\s+/);
    li.innerHTML = `
      <span class="swatch" style="background:${RINGDOT[i]}"></span>
      <span class="flag">${st.cc?flagOf(st.cc):'◦'}</span>
      <span class="loc">
        <span class="name engraved">${st.name}</span>
        <span class="zone">${zoneInfo(st.tz, ms)}</span>
      </span>
      <span class="right">
        <span class="time engraved">${tnum} <span class="ampm">${tmer||''}</span></span>
        <span class="sub">${p.wd.toUpperCase()}${dd!==0?` <span class="day">${dd>0?'+':''}${dd}d</span>`:''}</span>
      </span>
      ${stations.length>1?`<button class="rm" aria-label="Remove ${st.name}">✕</button>`:''}
    `;
    li.addEventListener('mouseenter', ()=>{ hoverRing=i; hoverChanged(); });
    li.addEventListener('mouseleave', ()=>{ hoverRing=-1; hoverChanged(); });
    stationList.appendChild(li);
  });
}
/* delegated so a re-render can never orphan the button mid-click */
stationList.addEventListener('click', e=>{
  const b = e.target.closest('.rm');
  if (!b) return;
  const i = +b.closest('li').dataset.i;
  stations.splice(i,1); hoverRing=-1; update();
});

/* search */
const input = document.getElementById('searchInput');
const results = document.getElementById('searchResults');
let selIdx = 0;
function searchMatches(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  return CITIES.filter(c =>
    c.name.toLowerCase().includes(q) &&
    !stations.some(s=>s.name===c.name)
  ).slice(0,7);
}
function renderResults(){
  const ms = searchMatches(input.value);
  results.innerHTML='';
  results.classList.toggle('open', ms.length>0);
  ms.forEach((c,i)=>{
    const b = document.createElement('button');
    b.type='button'; b.setAttribute('role','option');
    if (i===selIdx) b.classList.add('sel');
    b.innerHTML = `<span>${flagOf(c.cc)}</span><span>${c.name}</span><span class="co">${c.cc}</span>`;
    b.addEventListener('click', ()=>addCity(c));
    results.appendChild(b);
  });
}
function addCity(c){
  if (stations.length >= MAX_STATIONS){
    input.value=''; input.placeholder='Six stations maximum — remove one first';
    results.classList.remove('open');
    return;
  }
  stations.push(c);
  input.value=''; input.placeholder='Add a city…';
  results.classList.remove('open'); selIdx=0;
  update();
}
input.addEventListener('input', ()=>{ selIdx=0; renderResults(); });
input.addEventListener('keydown', e=>{
  const ms = searchMatches(input.value);
  if (e.key==='ArrowDown'){ selIdx=Math.min(selIdx+1, ms.length-1); renderResults(); e.preventDefault(); }
  if (e.key==='ArrowUp'){ selIdx=Math.max(selIdx-1, 0); renderResults(); e.preventDefault(); }
  if (e.key==='Enter' && ms[selIdx]){ addCity(ms[selIdx]); e.preventDefault(); }
  if (e.key==='Escape'){ results.classList.remove('open'); }
});
document.addEventListener('click', e=>{
  if (!e.target.closest('.search')) results.classList.remove('open');
});

/* buttons */
document.getElementById('btnNow').addEventListener('click', ()=>{
  sel = Date.now(); setFollowing(true); update();
});
document.getElementById('btnBest').addEventListener('click', ()=>{
  // score every 15-min slot of the home city's current calendar day
  const ms0 = snappedSel();
  const home = stations[0];
  const p = tzParts(home.tz, ms0);
  const dayStart = ms0 - (p.h*60+p.m)*60000;
  let best = ms0, bestScore = -Infinity;
  for (let k=0;k<96;k++){
    const t = dayStart + k*15*60000;
    let score = 0;
    for (const st of stations){
      const h = tzParts(st.tz, t).h;
      if (h>=9 && h<18) score += 2;
      else if ((h>=8&&h<9)||(h>=18&&h<21)) score += 1;
      else if (h>=23 || h<7) score -= 3;
    }
    if (score > bestScore){ bestScore = score; best = t; }
  }
  sel = best; setFollowing(false); update();
});
document.getElementById('btnCopy').addEventListener('click', async e=>{
  const ms = snappedSel();
  const home = stations[0];
  const p = tzParts(home.tz, ms);
  const parts = stations.map(st=>{
    const dd = dayDiff(st.tz, ms);
    const w = dd!==0 ? ` (${tzParts(st.tz,ms).wd})` : '';
    return `${st.name} ${fmtTime(st.tz,ms).replace(' ',' ')}${w}`;
  });
  const text = `${p.wd}, ${p.mon} ${p.day} — ${parts.join(' · ')}`;
  try{
    await navigator.clipboard.writeText(text);
    const btn = e.currentTarget; const old = btn.textContent;
    btn.textContent='COPIED ✓';
    setTimeout(()=>{ btn.textContent = old; }, 1400);
  }catch{ prompt('Copy meeting times:', text); }
});

/* ============================== boot ============================== */
function update(){
  rebuildRings();
  renderStations();
  if (REDUCED) drawFrame(0);   // otherwise the rAF loop picks the layer up
}
/* hover must NOT rebuild the plaque DOM — a re-render mid-click would
   destroy the ✕ button between mousedown and mouseup */
function hoverChanged(){
  rebuildRings();
  if (REDUCED) drawFrame(0);
  [...stationList.children].forEach((li,i)=>li.classList.toggle('hover', i===hoverRing));
}
setInterval(()=>{ if (following){ sel = Date.now(); update(); } }, 30000);

update();
if (!REDUCED){
  requestAnimationFrame(function loop(ts){ drawFrame(ts); requestAnimationFrame(loop); });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);
</script>
